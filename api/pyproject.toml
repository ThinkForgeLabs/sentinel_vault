[project]
name = "sentinel-vault-api"
version = "0.1.0"
description = "Sentinel Vault API server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4's bcrypt backend detection breaks on bcrypt>=4.0
    # (removed the `__about__.__version__` attribute it probes for).
    "bcrypt<4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    # MQTT client for ingesting ESPHome / Zigbee2MQTT sensor devices
    # (app/modules/devices/mqtt_manager.py). Pinned below 2.0 to keep the
    # simple pre-VERSION2 callback signatures (on_connect/on_message with
    # positional args), matching how this codebase's other singleton
    # managers are written.
    "paho-mqtt>=1.6.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]