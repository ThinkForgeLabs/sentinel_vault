# Serves the built SPA and reverse-proxies /api to the backend container.
# Mirrors the proxy rule in vite.config.ts used for local dev.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Camera MJPEG streams stay open indefinitely.
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # SPA fallback so client-side routes (e.g. /cameras, /events) resolve on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
